# imgenai Code 发版：推送 imgenai-v<版本号> 标签（例如 imgenai-v1.0.0）触发。
#
#   准备    建草稿 Release
#   macOS   两个架构各编一遍 → 合成通用二进制 → 打 DMG（没配签名时 ad-hoc 签名）→ 公证。
#           公证等超时就在这次运行上点「Re-run failed jobs」，会接着等同一个提交，不重新打包。
#   Windows 编译 → NSIS 安装包 + zip
#   收尾    SHA256SUMS.txt、latest.json（客户端自动更新读它）。推标签触发时停在草稿，
#           确认安装包没问题后在 GitHub 网页上点发布，或手动运行本工作流并勾选 publish。
#
# 每个构建都先跑 scripts/imgenai/prepare-src.mjs：在 $RUNNER_TEMP/src 生成改名为 imgenai Code 的副本，
# 版本号与自动更新源写进副本。源码分支保持上游写法，合并上游更新时不冲突。
# 上游自带的工作流（release-assets.yml 等）在本仓库里停用，只用这一个。
name: imgenai Code release

on:
  push:
    tags:
      - "imgenai-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的标签，例如 imgenai-v1.0.0"
        required: true
        type: string
      publish:
        description: "附件齐了以后公开发布（不勾就停在草稿）"
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: imgenai-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#imgenai-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "标签要写成 imgenai-v<主>.<次>.<修订>，实际是 $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，沿用"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "imgenai Code $VERSION" \
            --notes "imgenai Code ${VERSION}。基于开源项目 Codex++（AGPL-3.0）修改，源码即本仓库。"

  macos-build:
    name: macOS build (${{ matrix.target }})
    needs: prepare
    runs-on: macos-15
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare imgenai Code source
        run: node scripts/imgenai/prepare-src.mjs "$RUNNER_TEMP/src" --version "$VERSION" --update-repo "$GITHUB_REPOSITORY"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/src -> target
          shared-key: imgenai-macos-${{ matrix.target }}

      - name: Build frontend
        working-directory: ${{ runner.temp }}/src/apps/codex-plus-manager
        run: npm ci && npm run vite:build

      - name: Build ${{ matrix.target }}
        working-directory: ${{ runner.temp }}/src
        run: cargo build --release --target ${{ matrix.target }} -p codex-plus-manager

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bin-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/src/target/${{ matrix.target }}/release/codex-plus-plus
            ${{ runner.temp }}/src/target/${{ matrix.target }}/release/codex-plus-legacy-shim
          if-no-files-found: error
          # 留一周：重跑时没找到待公证的包（比如上次连提交都没成功），还要用它们重新打包。
          retention-days: 7

  macos-dmg:
    name: macOS DMG (universal)
    needs: [prepare, macos-build]
    runs-on: macos-15
    # Apple 新账号头几次公证可能排几个小时；留足时间（GitHub 上限 6 小时）。
    # 提交公证后包和提交号先存成构建产物（macos-dmg-pending）。等超时了在这次运行上点「Re-run failed jobs」，
    # 会接着等同一个提交并装订这个包，不重新打包，也不用从头排队。
    timeout-minutes: 340
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      VERSION: ${{ needs.prepare.outputs.version }}
      # 仓库里配了 Developer ID 证书就正式签名并公证，没配就 ad-hoc 签名（用户首次打开要手动放行）。
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      # 重跑时先找上一次尝试存下的包：有就接着等那次公证。重新打包会生成新文件，得从头排队。
      - name: Look for a DMG from an earlier attempt
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-dmg-pending
          path: ${{ runner.temp }}/pending

      - name: Resume or build
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(ls "$RUNNER_TEMP"/pending/*.dmg 2>/dev/null | head -1 || true)"
          if [ -n "$DMG" ] && [ -s "$RUNNER_TEMP/pending/notary-id.txt" ]; then
            ID="$(tr -d '[:space:]' < "$RUNNER_TEMP/pending/notary-id.txt")"
            echo "接着等上一次的公证：$(basename "$DMG")，提交 id ${ID}"
            {
              echo "RESUME=1"
              echo "DMG_PATH=$DMG"
              echo "NOTARY_ID=$ID"
            } >> "$GITHUB_ENV"
          else
            echo "没有等公证的包，重新打包"
          fi

      - name: Prepare imgenai Code source
        if: env.RESUME != '1'
        run: node scripts/imgenai/prepare-src.mjs "$RUNNER_TEMP/src" --version "$VERSION" --update-repo "$GITHUB_REPOSITORY"

      - uses: actions/download-artifact@v4
        if: env.RESUME != '1'
        with:
          name: macos-bin-x86_64-apple-darwin
          path: ${{ runner.temp }}/src/target/x86_64-apple-darwin/release

      - uses: actions/download-artifact@v4
        if: env.RESUME != '1'
        with:
          name: macos-bin-aarch64-apple-darwin
          path: ${{ runner.temp }}/src/target/aarch64-apple-darwin/release

      # 证书导入与公证凭据的写法照搬上游 release-assets.yml 的 macos-dmg 任务。
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true' && env.RESUME != '1'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # 临时钥匙串，不碰 runner 自带的，job 结束随机器销毁；密码现生成。
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # 少了这一步 codesign 会弹授权框然后挂住直到超时。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # runner 的系统钥匙串里没有 Developer ID G2 中间证书，缺了它身份列不出来。
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign
          security find-identity -v -p codesigning

      - name: Store notarization credentials
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          xcrun notarytool store-credentials "imgenai-notary" --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          rm -f "$KEY_PATH"
          # 不交给打包脚本公证（它用 --wait 一直挂着，构建机网络一抖就整步失败）；打包后由下面的步骤提交并轮询。
          echo "IMGENAI_NOTARY_PROFILE=imgenai-notary" >> "$GITHUB_ENV"

      - name: Build universal DMG
        if: env.RESUME != '1'
        working-directory: ${{ runner.temp }}/src
        env:
          UNIVERSAL_SKIP_BUILD: "1"
          SIGNING_IDENTITY_SECRET: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            export MACOS_SIGNING_IDENTITY="$SIGNING_IDENTITY_SECRET"
            echo "正式签名：${MACOS_SIGNING_IDENTITY}；公证：${IMGENAI_NOTARY_PROFILE:-未配置}（打包后单独提交）"
          else
            echo "未配置 Developer ID 证书：ad-hoc 签名，跳过公证"
          fi
          chmod +x target/*-apple-darwin/release/codex-plus-plus target/*-apple-darwin/release/codex-plus-legacy-shim
          bash scripts/installer/macos/build-universal.sh "$VERSION"
          ls -la dist/macos/*.dmg
          echo "DMG_PATH=$(ls "$PWD"/dist/macos/*.dmg | head -1)" >> "$GITHUB_ENV"

      # 提交失败（断网、Apple 接口抖动）隔 30 秒重试，最多 5 次。提交成功后把包和提交号放进同一个目录，下一步存成构建产物。
      - name: Submit for notarization
        if: env.IMGENAI_NOTARY_PROFILE != '' && env.RESUME != '1'
        run: |
          set -euo pipefail
          json_field() { python3 -c 'import json,sys; print(json.load(sys.stdin).get(sys.argv[1], ""))' "$1"; }
          ID=""
          for attempt in 1 2 3 4 5; do
            if OUT="$(xcrun notarytool submit "$DMG_PATH" --keychain-profile "$IMGENAI_NOTARY_PROFILE" --output-format json 2>"$RUNNER_TEMP/notary.err")"; then
              ID="$(printf '%s' "$OUT" | json_field id)"
              [ -n "$ID" ] && break
            fi
            echo "提交公证失败（第 ${attempt} 次），30 秒后重试：$(cat "$RUNNER_TEMP/notary.err")"
            sleep 30
          done
          [ -n "$ID" ] || { echo "::error::提交公证失败"; exit 1; }
          echo "公证提交 id：${ID}"
          echo "NOTARY_ID=$ID" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pending-out"
          cp "$DMG_PATH" "$RUNNER_TEMP/pending-out/"
          printf '%s\n' "$ID" > "$RUNNER_TEMP/pending-out/notary-id.txt"

      - name: Keep DMG until notarization finishes
        if: env.IMGENAI_NOTARY_PROFILE != '' && env.RESUME != '1'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-pending
          path: ${{ runner.temp }}/pending-out/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      # 每分钟查一次状态：查询失败只是下一分钟再查，不让整步失败。Accepted 后装订票据（用户离线也能过 Gatekeeper），
      # Invalid / Rejected 打出 Apple 的日志后失败（得改代码、升版本号重新发）。
      - name: Wait for notarization
        if: env.IMGENAI_NOTARY_PROFILE != ''
        run: |
          set -euo pipefail
          json_field() { python3 -c 'import json,sys; print(json.load(sys.stdin).get(sys.argv[1], ""))' "$1"; }
          ID="$NOTARY_ID"
          DEADLINE=$(( $(date +%s) + 5 * 3600 ))
          STATUS=""
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if INFO="$(xcrun notarytool info "$ID" --keychain-profile "$IMGENAI_NOTARY_PROFILE" --output-format json 2>"$RUNNER_TEMP/notary.err")"; then
              STATUS="$(printf '%s' "$INFO" | json_field status)"
              echo "$(date -u +%H:%M:%S) 公证状态：${STATUS}"
            else
              echo "$(date -u +%H:%M:%S) 查询失败，下一分钟再查：$(cat "$RUNNER_TEMP/notary.err")"
            fi
            case "$STATUS" in
              Accepted) break ;;
              Invalid|Rejected)
                xcrun notarytool log "$ID" --keychain-profile "$IMGENAI_NOTARY_PROFILE" || true
                echo "::error::公证未通过（${STATUS}），提交 id ${ID}"
                exit 1 ;;
            esac
            sleep 60
          done
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::等公证超时（最后状态：${STATUS:-未知}），提交 id ${ID}。包已存成构建产物 macos-dmg-pending，在这次运行上点「Re-run failed jobs」会接着等同一个提交。"
            exit 1
          fi
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          echo "公证通过，票据已装订：$(basename "$DMG_PATH")"

      - name: Upload DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "$DMG_PATH" --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    name: Windows installer
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Windows 构建机默认把换行转成 CRLF，改名与版本号脚本按仓库里的 LF 解析，检出前关掉转换。
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare imgenai Code source
        shell: bash
        run: node scripts/imgenai/prepare-src.mjs "$RUNNER_TEMP/src" --version "$VERSION" --update-repo "$GITHUB_REPOSITORY"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/src -> target
          shared-key: imgenai-windows

      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            $candidates = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
            $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if ($makensis) { & $makensis /VERSION; if ($LASTEXITCODE -eq 0) { break } }
            $makensis = $null
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $makensis) { throw "NSIS 安装失败或编译器不可用。" }

      - name: Build frontend
        working-directory: ${{ runner.temp }}/src/apps/codex-plus-manager
        run: npm ci && npm run vite:build

      - name: Build application
        working-directory: ${{ runner.temp }}/src
        run: cargo build --release -p codex-plus-manager

      - name: Build zip and installer
        working-directory: ${{ runner.temp }}/src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/windows/app/
          Compress-Archive -Path dist/windows/app/* -DestinationPath "dist/windows/imgenaiCode-$env:VERSION-windows-x64.zip" -Force
          $candidates = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
          $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          Push-Location scripts/installer/windows
          try {
            & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$env:VERSION" CodexPlusPlus.nsi
            if ($LASTEXITCODE -ne 0) { throw "NSIS 打包失败，退出码 $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Get-ChildItem dist/windows

      - name: Upload Windows assets
        working-directory: ${{ runner.temp }}/src
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/windows/*.exe dist/windows/*.zip --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Checksums, latest.json and publish
    needs: [prepare, macos-dmg, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'imgenaiCode-*' --dir assets --clobber
          (cd assets && sha256sum imgenaiCode-* | sort -k2 > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

      # 客户端「检查更新」读 releases/latest/download/latest.json，按文件名挑本平台的安装包。
      - name: latest.json
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,body > release.json
          node <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const { VERSION: version, RELEASE_TAG: tag, GITHUB_REPOSITORY: repo } = process.env;
          const required = [
            `imgenaiCode-${version}-windows-x64-setup.exe`,
            `imgenaiCode-${version}-windows-x64.zip`,
            `imgenaiCode-${version}-macos-universal.dmg`,
          ];
          for (const name of required) {
            if (!(release.assets || []).some((asset) => asset.name === name && asset.size > 0)) throw new Error(`发布附件缺失或为空：${name}`);
          }
          const base = `https://github.com/${repo}/releases/download/${tag}`;
          const payload = {
            version: `v${version}`,
            url: `https://github.com/${repo}/releases/tag/${tag}`,
            body: release.body || "",
            assets: (release.assets || [])
              .map((asset) => asset.name)
              .filter((name) => name !== "latest.json")
              .map((name) => ({ name, url: `${base}/${encodeURIComponent(name)}` })),
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat latest.json
          gh release upload "$RELEASE_TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

      # 草稿只有仓库成员看得到；公开后客户端「检查更新」才会读到这一版。
      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
